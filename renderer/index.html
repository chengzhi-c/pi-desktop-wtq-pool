<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; form-action 'none'; base-uri 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    PI-Desktop owns a 46px drag band and the window-control capsule at the top
    of every panel; this panel keeps its own sticky header below that band.
  -->
  <meta name="pi-plugin-chrome" content="v3" />
  <title>pi-desktop-xdpool</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <header class="bar" id="topBar">
    <div class="bar-title">
      <span class="dot" id="healthDot" aria-hidden="true"></span>
      <strong id="barTitle">pi-desktop-xdpool</strong>
      <span class="muted" id="barSub"></span>
    </div>
    <div class="bar-actions">
      <button type="button" id="rescanBtn" class="ghost ic-scan"></button>
      <button type="button" id="resetBtn" class="ghost ic-rewind"></button>
      <button type="button" id="refreshBtn" class="ghost ic-refresh"></button>
    </div>
  </header>

  <p class="sr-only" id="live" aria-live="polite"></p>

  <main class="page">
    <div id="banner" class="banner" hidden></div>

    <!-- Source is the top level: WorkBuddy / Trae / Qoder each own one page of
         every view below, so the three sources never mix on one screen. -->
    <nav class="tabs" id="sourceTabs" role="tablist">
      <button type="button" class="tab active" data-source="workbuddy" role="tab" aria-selected="true">WorkBuddy</button>
      <button type="button" class="tab" data-source="trae" role="tab" aria-selected="false">Trae</button>
      <button type="button" class="tab" data-source="qoder" role="tab" aria-selected="false">Qoder</button>
    </nav>

    <!-- Only appears when PI-Desktop has not registered this plugin's model
         groups yet, which needs one toggle of the plugin to clear. -->
    <p class="hint" id="hostHint" hidden></p>

    <!-- Second level: the three views of the selected source. -->
    <nav class="subtabs" id="viewTabs" role="tablist">
      <button type="button" class="subtab active" data-tab="pool" role="tab" aria-selected="true"></button>
      <button type="button" class="subtab" data-tab="models" role="tab" aria-selected="false"></button>
      <button type="button" class="subtab" data-tab="check" role="tab" aria-selected="false"></button>
    </nav>

    <section id="poolView" class="view">
      <div class="source-group" id="workbuddyGroup" data-source="workbuddy">
        <div class="source-head" id="workbuddyHead"></div>
        <nav class="regions" id="regionTabs" role="tablist"></nav>
        <div class="strip" id="poolStrip"></div>
        <div id="accounts"></div>
      </div>
      <div class="source-group" id="traeStrip" data-source="trae" hidden></div>
      <div class="source-group" id="qoderStrip" data-source="qoder" hidden></div>
      <div class="card">
        <div class="card-head">
          <span class="card-title" id="composerTitle"></span>
          <span class="muted" id="composerState"></span>
        </div>
        <div class="switch-row">
          <button type="button" class="small" id="showComposerPoints"></button>
          <span class="switch-copy">
            <span class="switch-lead" id="composerPointsText"></span>
            <span class="hint" id="composerPointsHint"></span>
          </span>
        </div>
      </div>
      <div class="card">
        <div class="card-head">
          <span class="card-title" id="autoTitle"></span>
          <span class="muted" id="autoState"></span>
        </div>
        <div class="seg" id="autoControl" role="group"></div>
        <div class="auto-hours">
          <label class="muted" for="autoHours" id="autoHoursLabel"></label>
          <input type="text" id="autoHours" class="search" inputmode="numeric" />
          <button type="button" id="autoHoursSave" class="small"></button>
          <button type="button" id="autoRunNow" class="small"></button>
        </div>
        <!-- Its own box, below the controls rather than beside them: the lines
             are a log of what a pass did, and sharing a row with the hour field
             made both hard to read. -->
        <div class="hint log-box" id="autoNote"></div>
        <p class="hint" id="autoHint"></p>
      </div>
    </section>

    <section id="modelsView" class="view" hidden>
      <!-- One model page for all three sources: the region row and the two
           columns below are shared. What differs - which roster, which stored
           selection, which gateway the save writes - is answered in panel.js,
           so Trae and Qoder get the pool's own editor instead of a copy. -->
      <nav class="regions" id="modelRegionTabs" role="tablist"></nav>
      <!-- Two columns, like PI-Desktop's own model sheet: the roster on the
           left, the settings of the ticked models on the right. The grid
           collapses to one column (roster above settings) once the window is
           dragged narrower than 720px - see the media query in panel.css. -->
      <div class="model-columns">
        <section class="model-col">
          <div class="pane-head">
            <input type="checkbox" id="modelSelectAll" class="row-check" />
            <h3 class="pane-title" id="modelListTitle"></h3>
            <button type="button" class="pane-action ic-download" id="modelFetchBtn"></button>
          </div>
          <div class="pane-search">
            <input type="search" id="modelSearch" class="search" />
          </div>
          <div id="models" class="model-rows"></div>
        </section>

        <section class="model-col">
          <div class="pane-head">
            <h3 class="pane-title" id="modelEditTitle"></h3>
            <span class="count-chip" id="modelEditCount"></span>
          </div>
          <div class="pane-search">
            <input type="search" id="chosenSearch" class="search" />
          </div>
          <div id="chosen" class="model-rows"></div>
        </section>
      </div>

      <!-- A gateway's own last error, or the note about what the desktop will
           actually list. Empty for the pool. -->
      <p class="hint" id="modelPageHint"></p>
      <div class="savebar" id="savebar" hidden>
        <span id="saveNote"></span>
        <span class="spacer"></span>
        <button type="button" id="discardBtn" class="ghost ic-x"></button>
        <button type="button" id="saveBtn" class="primary ic-check"></button>
      </div>
    </section>

    <section id="checkView" class="view" hidden>
      <div class="card">
        <div class="card-head">
          <span class="card-title" id="checkTitle"></span>
          <button type="button" id="doctorBtn" class="ghost small ic-activity"></button>
          <button type="button" id="copyBtn" class="ghost small ic-copy"></button>
          <span class="copy-hint" id="copyHint"></span>
        </div>
        <div id="findings"></div>
        <pre id="report" class="report"></pre>
      </div>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>

  <script src="./panel.js"></script>
</body>
</html>
